[package]
name = "chrona-session"
description = "Chrona session I/O: WAV+JSON recording, replay, and the TOML config store"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
chrona-dsp = { path = "../chrona-dsp" }
hound = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
# M4 Task 4: arms a `SessionWriter::push` fault-injection seam (see
# writer.rs), keyed by the `CHRONA_TEST_FAIL_PUSH_AFTER` env var. Not
# `cfg(test)` — that's invisible across the crate boundary to chrona-app's
# own test builds — instead enabled unconditionally by chrona-app's
# [dev-dependencies] entry for this crate, so it's live for chrona-app's
# test/integration builds (where dev-dependency features unify with the
# normal-dependency edge for the whole build graph) without ever being
# compiled into a release build.
test-fault-injection = []
