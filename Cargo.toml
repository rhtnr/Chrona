[workspace]
resolver = "3"
members = ["crates/chrona-dsp", "crates/chrona-cli"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rohit/chrona"
version = "0.1.0"

[workspace.dependencies]
realfft = "3.5"
biquad = "0.6"
thiserror = "2"
hound = "3.5"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.test]
opt-level = 2

[profile.test.package."*"]
opt-level = 2
